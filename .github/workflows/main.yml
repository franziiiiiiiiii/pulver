name: Run Powder Diffraction Analysis

on:
  push:
    branches:
      - main

jobs:
  run-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13' # Based on your project settings

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy matplotlib uncertainties

      - name: Run CaF2 Analysis
        run: python caf2.py

      - name: Run KNO3 Analysis
        run: python kno3.py

      - name: Upload results (Optional)
        uses: actions/upload-artifact@v4
        with:
          name: analysis-figures
          path: figures/ # Uploads the generated PNG figures
